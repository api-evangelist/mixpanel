specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Mixpanel
providerId: mixpanel
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-04'
reconciled: true
tags:
  - Rate Limiting
  - Analytics
description: Mixpanel ingestion and query API rate limits.
sources:
  - https://mixpanel.com/pricing/
  - https://developer.mixpanel.com/reference/rate-limits
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
limits:
  - name: Ingestion API
    scope: project
    metric: events_per_second
    limit: 2000
    timeFrame: second per IP
    notes: Recommended; can be much higher with proper batching.
  - name: Batch import
    scope: project
    metric: events_per_request
    limit: 2000
    timeFrame: request
  - name: Query API
    scope: project
    metric: queries_per_hour
    limit: 60
    timeFrame: hour
  - name: Concurrent queries
    scope: project
    metric: concurrent
    limit: 5
