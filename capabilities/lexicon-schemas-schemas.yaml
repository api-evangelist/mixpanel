naftiko: 1.0.0-alpha2
info:
  label: Mixpanel Lexicon Schemas API — Schemas
  description: 'Mixpanel Lexicon Schemas API — Schemas. 4 operations. Lead operation: Mixpanel List schemas. Self-contained
    Naftiko capability covering one Mixpanel business surface.'
  tags:
  - Mixpanel
  - Schemas
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MIXPANEL_API_KEY: MIXPANEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: lexicon-schemas-schemas
    baseUri: https://mixpanel.com/api/app
    description: Mixpanel Lexicon Schemas API — Schemas business capability. Self-contained, no shared references.
    resources:
    - name: projects-projectId-schemas
      path: /projects/{projectId}/schemas
      operations:
      - name: listschemas
        method: GET
        description: Mixpanel List schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: entityType
          in: query
          type: string
          description: Filter schemas by entity type
      - name: replaceschemas
        method: PUT
        description: Mixpanel Replace schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: createschemas
        method: POST
        description: Mixpanel Create schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteschemas
        method: DELETE
        description: Mixpanel Delete schemas
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.MIXPANEL_USER}}'
      password: '{{env.MIXPANEL_PASS}}'
  exposes:
  - type: rest
    namespace: lexicon-schemas-schemas-rest
    port: 8080
    description: REST adapter for Mixpanel Lexicon Schemas API — Schemas. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{projectid}/schemas
      name: projects-projectid-schemas
      description: REST surface for projects-projectId-schemas.
      operations:
      - method: GET
        name: listschemas
        description: Mixpanel List schemas
        call: lexicon-schemas-schemas.listschemas
        with:
          entityType: rest.entityType
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: replaceschemas
        description: Mixpanel Replace schemas
        call: lexicon-schemas-schemas.replaceschemas
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createschemas
        description: Mixpanel Create schemas
        call: lexicon-schemas-schemas.createschemas
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteschemas
        description: Mixpanel Delete schemas
        call: lexicon-schemas-schemas.deleteschemas
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lexicon-schemas-schemas-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mixpanel Lexicon Schemas API — Schemas. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: mixpanel-list-schemas
      description: Mixpanel List schemas
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lexicon-schemas-schemas.listschemas
      with:
        entityType: tools.entityType
      outputParameters:
      - type: object
        mapping: $.
    - name: mixpanel-replace-schemas
      description: Mixpanel Replace schemas
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: lexicon-schemas-schemas.replaceschemas
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mixpanel-create-schemas
      description: Mixpanel Create schemas
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: lexicon-schemas-schemas.createschemas
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mixpanel-delete-schemas
      description: Mixpanel Delete schemas
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: lexicon-schemas-schemas.deleteschemas
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
