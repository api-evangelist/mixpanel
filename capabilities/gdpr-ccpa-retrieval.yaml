naftiko: 1.0.0-alpha2
info:
  label: Mixpanel GDPR and CCPA API — Retrieval
  description: 'Mixpanel GDPR and CCPA API — Retrieval. 2 operations. Lead operation: Mixpanel Create data retrieval request.
    Self-contained Naftiko capability covering one Mixpanel business surface.'
  tags:
  - Mixpanel
  - Retrieval
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MIXPANEL_API_KEY: MIXPANEL_API_KEY
capability:
  consumes:
  - type: http
    namespace: gdpr-ccpa-retrieval
    baseUri: https://mixpanel.com/api/app
    description: Mixpanel GDPR and CCPA API — Retrieval business capability. Self-contained, no shared references.
    resources:
    - name: data-retrievals-v3.0
      path: /data-retrievals/v3.0
      operations:
      - name: createretrievalrequest
        method: POST
        description: Mixpanel Create data retrieval request
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: data-retrievals-v3.0-taskId
      path: /data-retrievals/v3.0/{taskId}
      operations:
      - name: checkretrievalstatus
        method: GET
        description: Mixpanel Check retrieval status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MIXPANEL_API_KEY}}'
  exposes:
  - type: rest
    namespace: gdpr-ccpa-retrieval-rest
    port: 8080
    description: REST adapter for Mixpanel GDPR and CCPA API — Retrieval. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/data-retrievals/v3-0
      name: data-retrievals-v3-0
      description: REST surface for data-retrievals-v3.0.
      operations:
      - method: POST
        name: createretrievalrequest
        description: Mixpanel Create data retrieval request
        call: gdpr-ccpa-retrieval.createretrievalrequest
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/data-retrievals/v3-0/{taskid}
      name: data-retrievals-v3-0-taskid
      description: REST surface for data-retrievals-v3.0-taskId.
      operations:
      - method: GET
        name: checkretrievalstatus
        description: Mixpanel Check retrieval status
        call: gdpr-ccpa-retrieval.checkretrievalstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gdpr-ccpa-retrieval-mcp
    port: 9090
    transport: http
    description: MCP adapter for Mixpanel GDPR and CCPA API — Retrieval. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: mixpanel-create-data-retrieval-request
      description: Mixpanel Create data retrieval request
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gdpr-ccpa-retrieval.createretrievalrequest
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mixpanel-check-retrieval-status
      description: Mixpanel Check retrieval status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: gdpr-ccpa-retrieval.checkretrievalstatus
      outputParameters:
      - type: object
        mapping: $.
